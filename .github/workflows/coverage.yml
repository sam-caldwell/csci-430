name: Coverage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            llvm \
            llvm-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install llvm ninja cmake || true

      - name: Build, lint and test
        env:
          GENERATOR: Ninja
        run: |
          make clean
          make configure
          make lint -j2
          make test -j2
          make demo -j2

  coverage:
    name: Make Coverage & Publish Badge
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            llvm \
            llvm-dev

      - name: Detect LLVM prefix
        id: llvm
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "${prefix}" ]; then
            echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
            echo "LLVM_PREFIX=${prefix}" >> "$GITHUB_ENV"
          else
            echo "No versioned /usr/lib/llvm-* found; proceeding without LLVM_PREFIX"
          fi
          echo "Detected LLVM prefix: ${prefix:-none}"

      - name: Build coverage
        env:
          GENERATOR: Ninja
        run: |
          make coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: build/cmake-build-debug/coverage/lcov.info
          name: codecov-coverage
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
