name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Lint, Test, Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            clang-tidy \
            llvm \
            shellcheck

      - name: Environment info
        run: |
          echo "CC=$(command -v cc || true)"
          echo "CXX=$(command -v c++ || true)"
          echo "clang=$(command -v clang || true)"
          echo "clang++=$(command -v clang++ || true)"
          echo "clang-tidy=$(command -v clang-tidy || true)"
          cmake --version
          ninja --version || true

      - name: make clean
        run: make clean

      - name: make lint
        env:
          # Prefer Ninja if present; Makefile auto-detects as well
          CMAKE_GENERATOR: Ninja
        run: make lint

      - name: make test
        env:
          CMAKE_GENERATOR: Ninja
        run: make test

      - name: make build
        env:
          CMAKE_GENERATOR: Ninja
        run: make build

      - name: make demo
        env:
          CMAKE_GENERATOR: Ninja
        run: make demo

